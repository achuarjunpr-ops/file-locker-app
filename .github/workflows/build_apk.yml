name: Build Flutter APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Android Template
        run: |
          flutter create . --platforms=android --org com.example

      - name: Configure AdMob in AndroidManifest
        run: |
          sed -i '/<\/application>/i \        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3940256099942544~3347511713"/>' android/app/src/main/AndroidManifest.xml

      - name: Install Dependencies
        run: flutter pub get

      - name: Patch google_mobile_ads Gradle Bug
        run: |
          python3 -c "
          import glob
          for filepath in glob.glob('/home/runner/.pub-cache/hosted/*/google_mobile_ads/android/build.gradle', recursive=True):
              with open(filepath, 'r') as f:
                  lines = f.readlines()
              new_lines = []
              inside_block = False
              brace_count = 0
              for line in lines:
                  if 'configurations.all' in line and not inside_block:
                      inside_block = True
                      brace_count += line.count('{') - line.count('}')
                      new_lines.append('// [PATCHED] ' + line)
                      if brace_count <= 0:
                          inside_block = False
                  elif inside_block:
                      brace_count += line.count('{') - line.count('}')
                      new_lines.append('// [PATCHED] ' + line)
                      if brace_count <= 0:
                          inside_block = False
                  else:
                      new_lines.append(line)
              with open(filepath, 'w') as f:
                  f.writelines(new_lines)
              print(f'Successfully patched {filepath}')
          "

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FileLocker-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
