name: Build Flutter APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Android Template
        run: |
          flutter create . --platforms=android --org com.example

      - name: Configure AdMob in AndroidManifest
        run: |
          sed -i '/<\/application>/i \        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3940256099942544~3347511713"/>' android/app/src/main/AndroidManifest.xml

      - name: Install Dependencies
        run: flutter pub get

      - name: Fix google_mobile_ads Build Script
        run: |
          find /home/runner/.pub-cache/hosted/ -name "build.gradle" -path "/google_mobile_ads/*" | while read -r file; do
          cat << 'EOF' > "$file"
          group 'io.flutter.plugins.googlemobileads'
          version '1.0-SNAPSHOT'

          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.0'
              }
          }

          apply plugin: 'com.android.library'

          android {
              namespace "io.flutter.plugins.googlemobileads"
              compileSdk 34

              defaultConfig {
                  minSdkVersion 21
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }

          dependencies {
              implementation 'com.google.android.gms:play-services-ads:23.0.0'
              implementation 'androidx.annotation:annotation:1.7.0'
              implementation 'androidx.lifecycle:lifecycle-process:2.7.0'
          }
          EOF
            echo "Patched $file successfully"
          done

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FileLocker-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
