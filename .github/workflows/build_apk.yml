name: Build Flutter APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Android Template & Configure SDK and Signing
        run: |
          flutter create . --platforms=android --org com.example

          # 1. CompileSDK 36 All Subprojects
          cat << 'EOF' >> android/build.gradle

          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty('android')) {
                      project.android {
                          compileSdkVersion 36
                      }
                  }
              }
          }
          EOF

          # 2. Add Debug Signing to Release Build
          if [ -f android/app/build.gradle ]; then
            cat << 'EOF' >> android/app/build.gradle

          android {
              buildTypes {
                  release {
                      signingConfig signingConfigs.debug
                  }
              }
          }
          EOF
          fi

          if [ -f android/app/build.gradle.kts ]; then
            cat << 'EOF' >> android/app/build.gradle.kts

          android {
              buildTypes {
                  getByName("release") {
                      signingConfig = signingConfigs.getByName("debug")
                  }
              }
          }
          EOF
          fi

      - name: Configure AdMob in AndroidManifest
        run: |
          sed -i '/<\/application>/i \        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3940256099942544~3347511713"/>' android/app/src/main/AndroidManifest.xml

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK
        run: |
          for f in $(find /home/runner/.pub-cache/ -name "build.gradle" | grep "google_mobile_ads.*/android/build.gradle"); do
            cat << 'EOF' > "$f"
          group 'io.flutter.plugins.googlemobileads'
          version '1.0-SNAPSHOT'

          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.0'
              }
          }

          apply plugin: 'com.android.library'

          android {
              namespace "io.flutter.plugins.googlemobileads"
              compileSdk 36

              defaultConfig {
                  minSdkVersion 21
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }

          dependencies {
              implementation 'com.google.android.gms:play-services-ads:23.0.0'
              implementation 'androidx.annotation:annotation:1.7.0'
              implementation 'androidx.lifecycle:lifecycle-process:2.7.0'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
              implementation 'com.google.errorprone:error_prone_annotations:2.26.1'
          }
          EOF
            echo "Successfully Patched $f"
          done
          flutter build apk --release --no-pub

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FileLocker-Release-APK
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/apk/release/*.apk
